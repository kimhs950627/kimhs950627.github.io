name: pages.json 갱신

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 KST
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/build-pages.py"
      - "data/curated.json"
      - ".github/workflows/update-pages.yml"

permissions:
  contents: write

concurrency:
  group: pages-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 목록 생성
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build-pages.py

      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pages.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 페이지 목록 갱신"
            for attempt in 1 2 3; do
              if git push origin HEAD:master; then echo "pushed"; exit 0; fi
              echo "재시도 $attempt — 최신 커밋으로 rebase"
              if ! git pull --rebase --autostash origin master; then
                echo "rebase 충돌 — 이번 실행은 건너뛴다(다음 실행이 다시 만든다)"
                git rebase --abort || true
                exit 0
              fi
            done
            exit 1
          fi
