name: 아침 알림

on:
  schedule:
    - cron: "0 22 * * *" # 07:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noti-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 큐에 쌓인 새벽 작업 결과를 한 번에 보낸다
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 scripts/noti.py flush

      - name: 큐 비우기 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noti-queue.jsonl
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 아침 알림 발송 후 큐 비움"
            git pull --rebase --autostash origin master || true
            git push || (git pull --rebase --autostash origin master && git push)
          fi
