name: 발행 상태 동기화

on:
  schedule:
    - cron: "0 19 * * *" # 04:00 KST
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/publish.py"
      - "scripts/build-pages.py"
      - "data/curated.json"

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 공개/비공개 재판정 · 재배포
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          GH_TOKEN: ${{ secrets.PAGES_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/publish.py sync

      - name: 색인 재생성
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build-pages.py

      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/curated.json data/pages.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 발행 상태 동기화"
            git pull --rebase --autostash origin master || true
            git push || (git pull --rebase --autostash origin master && git push)
          fi
