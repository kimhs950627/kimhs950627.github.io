name: 발행 상태 동기화

on:
  schedule:
    - cron: "0 19 * * *" # 04:00 KST
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/publish.py"
      - "scripts/build-pages.py"
      - "data/curated.json"

permissions:
  contents: write

concurrency:
  group: pages-index
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 공개/비공개 재판정 · 재배포
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          GH_TOKEN: ${{ secrets.PAGES_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          python3 scripts/publish.py sync 2>&1 | tee /tmp/sync.log
          summary=$(grep -E "^sync 완료" /tmp/sync.log | tail -1)
          fails=$(grep -c "  ! " /tmp/sync.log || true)
          [ -n "$summary" ] || summary="sync 요약 없음"
          if [ "${fails:-0}" -gt 0 ]; then summary="$summary · 실패 ${fails}건"; fi
          python3 scripts/noti.py add "$summary"

      - name: 색인 재생성
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build-pages.py

      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/curated.json data/pages.json data/noti-queue.jsonl
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 발행 상태 동기화"
            for attempt in 1 2 3; do
              if git push origin HEAD:master; then echo "pushed"; exit 0; fi
              echo "재시도 $attempt — 최신 커밋으로 rebase"
              if ! git pull --rebase --autostash origin master; then
                echo "rebase 충돌 — 이번 실행은 건너뛴다(다음 실행이 다시 만든다)"
                git rebase --abort || true
                exit 0
              fi
            done
            exit 1
          fi
