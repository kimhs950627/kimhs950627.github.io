name: 색인 변경 추적

on:
  schedule:
    - cron: "0 20 * * *" # 05:00 KST — 04:00 발행 동기화 뒤에 돈다
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/track.py"
      - "scripts/app.js"
      - "data/track-ignore.json"
      - ".github/workflows/track.yml"

permissions:
  contents: write

concurrency:
  group: pages-index
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 스냅숏에는 비공개 저장소 이름이 들어간다 → 저장소에 커밋하지 않고 캐시에만 둔다.
      - name: 지난 스냅숏 복원
        uses: actions/cache/restore@v4
        with:
          path: data/repos-state.json
          key: track-state-${{ github.run_id }}
          restore-keys: |
            track-state-

      - name: 색인 재생성
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build-pages.py

      - name: 변경 추적 · 미등록 페이지 자동 등재
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/track.py --apply --publish-private --noti

      # 비공개 발행은 curated.json 을 고치므로 색인을 한 번 더 굽는다
      - name: 색인 재생성 (등재 반영)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build-pages.py

      - name: 스냅숏 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/repos-state.json
          key: track-state-${{ github.run_id }}

      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/activity.json data/pages.json data/curated.json data/noti-queue.jsonl
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 색인 변경 추적"
            for attempt in 1 2 3; do
              if git push origin HEAD:master; then echo "pushed"; exit 0; fi
              echo "재시도 $attempt — 최신 커밋으로 rebase"
              if ! git pull --rebase --autostash origin master; then
                echo "rebase 충돌 — 이번 실행은 건너뛴다(다음 실행이 다시 만든다)"
                git rebase --abort || true
                exit 0
              fi
            done
            exit 1
          fi
